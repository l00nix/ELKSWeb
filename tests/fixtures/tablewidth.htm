<html><head><title>Cell width behavior</title></head><body>
<table border=1 cellpadding=2><tr><td width=60>one two three four five six</td><td>neighbor</td></tr></table>
<table border=1 cellpadding=2><tr><td width=1>Supercalifragilistic</td><td>neighbor</td></tr></table>
<table border=1 cellpadding=2><tr><td width=60><ul><li>one two three four five six</li><li>second item</li></ul></td><td>neighbor</td></tr></table>
<table border=1 cellpadding=2><tr><td width=60><input size=12 value=abcdefghijkl></td><td>neighbor</td></tr></table>
<table border=1 cellpadding=2><tr><td width=60><pre>one two three four five six</pre></td><td>neighbor</td></tr></table>
</body></html>
